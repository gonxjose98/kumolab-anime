<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@500;600;700;800&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<style>
:root{--gold:#F6B73C;--gold2:#FFD27A;--ink:#0B2A5B;--sky1:#9FD2FF;--sky2:#4F9BEA;--deep:#1F56C2;--deeper:#163F9A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;font-family:Manrope,sans-serif}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;margin:0 0 40px;color:#fff;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 38%,var(--deep) 78%,var(--deeper) 100%)}
.cloud{position:absolute;z-index:1;filter:drop-shadow(0 18px 24px rgba(15,50,120,.18))}
.sun{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,250,228,.95) 0%,rgba(255,226,140,.75) 30%,rgba(255,214,110,.18) 55%,rgba(255,214,110,0) 70%)}
.top{position:absolute;top:40px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.brand{display:flex;align-items:center;gap:14px;font-family:'Cormorant Garamond';font-weight:700;font-size:34px;letter-spacing:.14em}
.brand svg{width:46px}
.pill{font-weight:700;font-size:20px;letter-spacing:.2em;text-transform:uppercase;padding:12px 22px;border-radius:999px;
  background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.45);backdrop-filter:blur(8px)}
.jp{font-family:'Shippori Mincho';letter-spacing:.3em}
.serif{font-family:'Cormorant Garamond';font-variant-numeric:lining-nums}
.shadow{text-shadow:0 2px 18px rgba(8,30,80,.35)}
.glass{background:linear-gradient(160deg,rgba(40,98,210,.78),rgba(24,70,170,.82));border:1.5px solid rgba(255,255,255,.42);
  border-radius:34px;backdrop-filter:blur(14px);box-shadow:0 30px 60px rgba(10,35,100,.28)}
.cover{border-radius:26px;box-shadow:0 36px 70px rgba(6,24,70,.45),0 0 0 6px rgba(255,255,255,.85);display:block}
.gold{color:var(--gold2)}
.btn{display:inline-block;background:linear-gradient(180deg,#FFD27A,#F6A93C);color:var(--ink);font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;border-radius:999px;box-shadow:0 14px 30px rgba(246,169,60,.45)}
.foot{position:absolute;bottom:52px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-weight:700;
  font-size:22px;letter-spacing:.18em;text-transform:uppercase;opacity:.92;z-index:5}
.dots{display:flex;gap:10px}.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4)}.dots i.on{background:var(--gold2);width:30px;border-radius:6px}
.banner{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.13;mix-blend-mode:luminosity;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.6) 45%,transparent 75%)}
</style></head><body>

<svg width="0" height="0" style="position:absolute">
 <defs>
  <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".62" stop-color="#F4F9FF"/><stop offset="1" stop-color="#D6E7FB"/></linearGradient>
  <symbol id="cloud" viewBox="0 0 400 170">
   <path d="M30 150 C8 150 4 112 34 104 C30 70 70 52 98 70 C108 30 160 14 196 44 C218 12 282 16 296 62 C330 50 366 76 356 108 C392 112 394 150 364 150 Z" fill="url(#cg)"/>
   <path d="M44 150 C60 132 92 136 104 146 C124 128 166 130 180 146 C200 126 248 128 262 146 C282 130 330 132 352 150 Z" fill="#C9DDF6" opacity=".7"/>
   <path d="M110 64 C124 44 158 38 176 52" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/>
  </symbol>
  <symbol id="mark" viewBox="0 0 64 40"><path d="M12 36 C3 36 1 25 9 22 C8 13 17 8 24 12 C27 4 40 2 45 11 C52 9 60 15 58 23 C64 24 64 36 56 36 Z" fill="none" stroke="#FFD27A" stroke-width="3.2" stroke-linejoin="round"/></symbol>
 </defs>
</svg>

<div id="slides"></div>
<script>
const cloud=(x,y,w,o=1,flip=false,z=1)=>`<svg class="cloud" style="left:${x}px;top:${y}px;width:${w}px;opacity:${o};z-index:${z};${flip?'transform:scaleX(-1)':''}"><use href="#cloud"/></svg>`;
const header=(label)=>`<div class="top"><img src="logo-trim.png" alt="KumoLab" style="height:112px;width:auto;display:block;filter:brightness(0) invert(1) drop-shadow(0 2px 10px rgba(6,24,70,.45))"><div class="pill">${label}</div></div>`;
const dots=(n,dark)=>`<div class="dots">${[0,1,2,3,4,5,6].map(i=>`<i class="${i===n?'on':''}" style="${dark&&i!==n?'background:#0B2A5B33':''}"></i>`).join('')}</div>`;
const pick={title:'Delicious in Dungeon',meta:'2024 · 24 episodes · TRIGGER · Adventure / Comedy',votes:'765',score:'85%',watch:'Netflix',pitch:'A party cooks its way through a monster-filled dungeon. Warm, funny, and quietly deep about the bonds between them.'};
const stats=(accent)=>`<div style="margin-top:24px;display:flex;gap:44px;align-items:flex-end">
  <div><div class="serif" style="color:${accent};font-size:58px;font-weight:700;line-height:1">${pick.votes}</div><div style="margin-top:6px;font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase">Frieren fans recommend it</div></div>
  <div><div class="serif" style="color:${accent};font-size:58px;font-weight:700;line-height:1">${pick.score}</div><div style="margin-top:6px;font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase">Fan score</div></div>
  <div style="margin-left:auto;text-align:right"><div style="font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85">Watch on</div><div style="color:${accent};margin-top:6px;font-size:26px;font-weight:800">${pick.watch}</div></div></div>`;
const GOLD='#FFD27A';
// row of overlapping clouds forming a soft cloud bank, fading into light sky below
const bank=(y)=>{let s='';[-160,70,300,520,740,950].forEach((x,i)=>{s+=cloud(x,y+(i%2?30:0),400,1,i%2===1,3)});
  return s+`<div style="position:absolute;left:0;right:0;top:${y+125}px;height:330px;background:linear-gradient(180deg,#F4F9FF 0%,#E4EFFC 45%,rgba(228,239,252,0) 100%);z-index:2"></div>`};

const D=[
 {
  "title": "Violet Evergarden",
  "votes": 1188,
  "score": 85,
  "eps": 13,
  "format": "TV",
  "year": 2018,
  "studio": "Kyoto Animation",
  "color": "#3586e4",
  "genres": [
   "Drama",
   "Fantasy",
   "Slice of Life"
  ]
 },
 {
  "title": "Delicious in Dungeon",
  "votes": 765,
  "score": 85,
  "eps": 24,
  "format": "TV",
  "year": 2024,
  "studio": "TRIGGER",
  "color": "#e48650",
  "genres": [
   "Adventure",
   "Comedy",
   "Fantasy"
  ]
 },
 {
  "title": "Wandering Witch: The Journey of Elaina",
  "votes": 504,
  "score": 74,
  "eps": 12,
  "format": "TV",
  "year": 2020,
  "studio": "C2C",
  "color": "#50a1f1",
  "genres": [
   "Adventure",
   "Fantasy",
   "Slice of Life"
  ]
 },
 {
  "title": "To Your Eternity",
  "votes": 423,
  "score": 81,
  "eps": 20,
  "format": "TV",
  "year": 2021,
  "studio": "Brain's Base",
  "color": "#f1d6a1",
  "genres": [
   "Adventure",
   "Drama",
   "Fantasy"
  ]
 },
 {
  "title": "Witch Hat Atelier",
  "votes": 397,
  "score": 85,
  "eps": 13,
  "format": "ONA",
  "year": 2026,
  "studio": "BUG FILMS",
  "color": "#0d8693",
  "genres": [
   "Adventure",
   "Drama",
   "Fantasy"
  ]
 }
];
const pitch=["A former soldier learns what love means by writing letters for others. Grief handled with the same gentle care.",
 "A party cooks its way through a monster-filled dungeon. Warm, funny, and quietly deep about the bonds between them.",
 "A young witch travels from country to country. One quiet, bittersweet story at every stop.",
 "An immortal being wanders the world, learning to be human from the people it meets and loses.",
 "A girl who dreamed of magic discovers its secret is drawing. Gorgeous, gentle, and full of wonder."];
const watch=["Netflix","Netflix","Crunchyroll","Crunchyroll","Crunchyroll"];
const art=[['hi/a0.jpg','50% 80%'],['hi/a1.jpg','50% 34%'],['hi/a2.jpg','50% 38%'],['hi/a3.jpg','50% 30%'],['hi/a4.jpg','50% 28%']];
const BG='background:linear-gradient(180deg,#9FD2FF 0%,#EEF5FE 62%,#D3E6FB 100%)';
const artTop=(src,pos,hgt)=>`<div style="position:absolute;left:0;right:0;top:0;height:${hgt}px;z-index:1"><img src="${src}" style="width:100%;height:100%;object-fit:cover;object-position:${pos}">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,28,80,.5) 0%,rgba(8,28,80,0) 20%)"></div></div>`;
let h='';
h+=`<section class="slide" id="s0" style="${BG}">${artTop('hi/c5.jpg','24% 50%',900)}${bank(760)}${header('Fan picks')}
 <div style="position:absolute;top:1000px;left:0;right:0;text-align:center;z-index:4;color:#0B2A5B">
   <div class="jp" style="font-size:22px;opacity:.8">フリーレンが好きなら</div>
   <div class="serif" style="font-size:100px;font-weight:700;line-height:1;margin-top:6px">If you loved Frieren,</div>
   <div class="serif" style="font-size:72px;font-weight:600;line-height:1.05"><i>watch these</i> <span style="color:#E09A1E;font-size:92px">5</span></div></div>
 <div class="foot" style="bottom:40px;color:#0B2A5B">${dots(0,true)}<span>Swipe &nbsp;→</span></div></section>`;
D.forEach((m,i)=>{
 const ep=(m.format==='ONA'||m.format==='TV')?`${m.eps} episodes`:m.format;
 const meta=`${m.year} · ${ep} · ${m.studio} · ${m.genres.slice(0,2).join(' / ')}`;
 h+=`<section class="slide" id="s${i+1}" style="${BG}">${artTop(art[i][0],art[i][1],820)}${bank(680)}${header('If you loved Frieren')}
 <div class="serif" style="position:absolute;left:66px;top:540px;font-size:150px;font-weight:700;line-height:1;z-index:5;color:${GOLD};-webkit-text-stroke:2.5px rgba(11,42,91,.55);text-shadow:0 4px 0 rgba(11,42,91,.35),0 8px 30px rgba(6,24,70,.7)">0${i+1}</div>
 <div style="position:absolute;left:72px;right:72px;top:900px;z-index:4;color:#0B2A5B">
   <div class="serif" style="font-size:${m.title.length>24?56:78}px;font-weight:700;line-height:1">${m.title}</div>
   <div style="margin-top:12px;font-size:22px;font-weight:700;letter-spacing:.06em;opacity:.9">${meta}</div>
   <div style="margin-top:24px;display:flex;gap:44px;align-items:flex-end">
    <div><div class="serif" style="color:#D98E12;font-size:58px;font-weight:700;line-height:1">${m.votes.toLocaleString()}</div><div style="margin-top:6px;font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase">Frieren fans recommend it</div></div>
    <div><div class="serif" style="color:#D98E12;font-size:58px;font-weight:700;line-height:1">${m.score}%</div><div style="margin-top:6px;font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase">Fan score</div></div>
    <div style="margin-left:auto;text-align:right"><div style="font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85">Watch on</div><div style="color:#D98E12;margin-top:6px;font-size:26px;font-weight:800">${watch[i]}</div></div></div>
   <div style="margin-top:22px;font-size:25px;line-height:1.42;font-weight:600">${pitch[i]}</div></div>
 <div class="foot" style="bottom:36px;color:#0B2A5B">${dots(i+1,true)}<span style="font-size:18px">@kumolabanime</span></div></section>`;
});
const thumbs=['hi/a0.jpg','hi/a1.jpg','hi/a2.jpg','hi/t3.jpg','hi/a4.jpg'];
h+=`<section class="slide" id="s6" style="${BG}">
 <div style="position:absolute;left:0;right:0;top:0;height:620px;z-index:1;display:flex">${thumbs.map(s=>`<img src="${s}" style="flex:1;min-width:0;height:100%;object-fit:cover">`).join('')}
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,28,80,.5) 0%,rgba(8,28,80,0) 25%)"></div></div>
 ${bank(480)}${header('Save + share')}
 <div style="position:absolute;top:760px;left:80px;right:80px;text-align:center;z-index:4;color:#0B2A5B">
   <div class="serif" style="font-size:78px;font-weight:700;line-height:1.04">Know someone who finished Frieren and feels empty?</div>
   <div class="serif" style="font-size:64px;font-weight:600;font-style:italic;margin-top:18px;color:#E09A1E">Send them this.</div>
   <div style="margin-top:40px"><span class="btn" style="font-size:24px;padding:24px 44px">Follow @kumolabanime</span></div>
   <div style="margin-top:18px;font-size:20px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85">Daily anime news, verified</div></div>
 <div class="foot" style="bottom:40px;color:#0B2A5B">${dots(6,true)}<span style="font-size:18px">Save for your next binge</span></div></section>`;
document.getElementById('slides').innerHTML=h;

</script></body></html>
